name: Keel
options:
  bundleIdPrefix: com.abiodunosagie
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: R87873B42W
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    # Development signing adds get-task-allow, which lets any process of the same user attach
    # to Keel and drive the root helper through it. Only debug builds keep it.
  configs:
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  Keel:
    type: application
    platform: macOS
    sources:
      - path: Keel
      - path: Shared
      - path: KeelHelper/com.abiodunosagie.Keel.Helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - target: KeelHelper
        embed: true
        codeSign: false
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abiodunosagie.Keel
        PRODUCT_NAME: Keel
        INFOPLIST_FILE: Keel/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Keel/Resources/Keel.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Keel/ObjC/Keel-Bridging-Header.h
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
        USER_HEADER_SEARCH_PATHS: $(SRCROOT)/Shared
  KeelHelper:
    type: tool
    platform: macOS
    sources:
      - path: KeelHelper
        excludes:
          - "*.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abiodunosagie.Keel.Helper
        PRODUCT_NAME: KeelHelper
        SWIFT_OBJC_BRIDGING_HEADER: KeelHelper/KeelHelper-Bridging-Header.h
        USER_HEADER_SEARCH_PATHS: $(SRCROOT)/Shared
        SKIP_INSTALL: YES
        OTHER_CODE_SIGN_FLAGS: "--identifier com.abiodunosagie.Keel.Helper"
  KeelTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KeelTests
    dependencies:
      - target: Keel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abiodunosagie.KeelTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Keel.app/Contents/MacOS/Keel"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Keel:
    build:
      targets:
        Keel: all
        KeelTests: [test]
    test:
      targets:
        - KeelTests
